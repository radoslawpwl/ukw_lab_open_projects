services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sklep_network

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 100
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - sklep_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_HTTPS_PORT: "8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.pem
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /https/localhost-key.pem
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ContactMail__Host: ${CONTACT_SMTP_HOST:-mailpit}
      ContactMail__Port: ${CONTACT_SMTP_PORT:-1025}
      ContactMail__Security: ${CONTACT_SMTP_SECURITY:-None}
      ContactMail__Username: ${CONTACT_SMTP_USERNAME:-}
      ContactMail__Password: ${CONTACT_SMTP_PASSWORD:-}
      ContactMail__SenderAddress: ${CONTACT_SMTP_FROM:-contact@rp-bit.com}
      ContactMail__RecipientAddress: ${CONTACT_SMTP_TO:-contact@rp-bit.com}
      ContactMail__TestMode: ${CONTACT_SMTP_TEST_MODE:-true}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
      - "192.168.67.3:8080:8080"
      - "192.168.67.3:8443:8443"
    volumes:
      - ./certs:/https:ro
      - data_protection:/var/lib/rpbit/keys
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - sklep_network

volumes:
  postgres_data:
  data_protection:

networks:
  sklep_network: